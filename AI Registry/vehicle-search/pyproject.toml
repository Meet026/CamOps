[project]
name = "vehicle-search"
version = "0.1.0"
description = "Natural-language vehicle search service for Sentinel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "psycopg2-binary>=2.9",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",           # fuzzy string matching for vehicle/location
    "Pillow>=10.3",
]

[project.optional-dependencies]
llm = [
    "google-generativeai>=0.7",  # Gemini
    "openai>=1.30",              # OpenAI
]
vl = [
    "torch>=2.3",
    "transformers>=4.41",        # SigLIP 2
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",               # async test client
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
