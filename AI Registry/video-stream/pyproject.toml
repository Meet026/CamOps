[project]
name = "video-stream"
version = "0.1.0"
description = "RTSP -> HLS relay backend: converts a registered camera's live RTSP feed into browser-playable HLS, on demand, with automatic idle cleanup. No AI, no recording — a thin, honest relay."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
