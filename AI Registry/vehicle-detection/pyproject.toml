[project]
name = "vehicle-detection-phase2"
version = "0.1.0"
description = "Phase 2: vehicle detector (YOLO11n) -> crop -> Re-ID embedding -> pgvector storage pipeline"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3",
    "onnxruntime>=1.18",
    "Pillow>=10.4",
    "numpy>=1.26",
    "psycopg2-binary>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
