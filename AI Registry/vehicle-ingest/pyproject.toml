[project]
name = "vehicle-ingest"
version = "0.1.0"
description = "Periodically pulls a frame from each streamable camera's live HLS feed (via video-stream) and runs it through vehicle-detection's existing detect -> embed -> store pipeline. No new AI model, no new storage format -- a scheduler that feeds the pipeline that already exists."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    # Real, required transitively: vehicle-ingest imports vehicle-detection's
    # VehicleDetector and vehicle-reid's VehicleEmbedder classes directly
    # (see src/main.py, src/ingest_cycle.py) -- these are those two
    # projects' own real dependencies (confirmed from their pyproject.toml
    # files), needed here because vehicle-ingest constructs and holds the
    # loaded model objects itself rather than calling them over HTTP.
    "ultralytics>=8.3",
    "onnxruntime>=1.18",
    "Pillow>=10.4",
    "numpy>=1.26",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
